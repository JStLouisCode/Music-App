spring.application.name=music-app-backend

# Azure App Service tells the app which port to use through PORT / SERVER_PORT.
server.port=${PORT:8080}

# Default: in-memory H2 database. Data is lost on restart; fine for dev, CI and the first deploy.
spring.datasource.url=jdbc:h2:mem:musicapp;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Only expose the health endpoint publicly.
management.endpoints.web.exposure.include=health
