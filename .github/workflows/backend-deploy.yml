# Continuous deployment of the backend to Azure App Service (SYSC 4806 Lab 5 style),
# adapted for this repo, where the Maven project lives in backend/ instead of the root.
#
# Runs on every push to main that touches the backend: test + build, then deploy.
# The deploy job is skipped until these are set in the GitHub repo settings
# (Settings > Secrets and variables > Actions):
#   - Variable  AZURE_WEBAPP_NAME             e.g. music-app-backend-dev
#   - Secret    AZURE_WEBAPP_PUBLISH_PROFILE  contents of the downloaded .PublishSettings file
# See docs/azure-setup.md.
name: Backend Deploy (Azure)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false # never cancel a deployment halfway through

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/app.jar
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: build
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar

      - name: Deploy app.jar
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.jar

      # The free F1 tier can take a minute or two to start a cold app.
      - name: Smoke test /actuator/health
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}/actuator/health"
          for i in $(seq 1 20); do
            if curl -fsS "$url" | grep -q '"status":"UP"'; then
              echo "Backend is up: $url"
              exit 0
            fi
            echo "Waiting for $url ($i/20)..."
            sleep 15
          done
          echo "::error::Health check failed at $url"
          exit 1
