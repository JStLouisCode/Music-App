# Runs on every push and pull request that touches the backend.
# Steps 1-3 of the backend pipeline in the proposal: unit tests, integration tests, build.
name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21" # keep in sync with <java.version> in backend/pom.xml
          cache: maven
          cache-dependency-path: backend/pom.xml

      # `verify` = compile, unit tests (*Test), package app.jar, integration tests (*IT)
      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

      - name: Upload app.jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/app.jar
          retention-days: 7
